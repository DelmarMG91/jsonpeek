[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonpeek"
version = "0.1.0"
description = "A tiny, zero-dependency command-line JSON query tool - a lean alternative to jq."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DelmarMG91" }]
keywords = ["json", "jq", "cli", "query", "jsonpath", "command-line"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/DelmarMG91/jsonpeek"
Source = "https://github.com/DelmarMG91/jsonpeek"
Issues = "https://github.com/DelmarMG91/jsonpeek/issues"
Changelog = "https://github.com/DelmarMG91/jsonpeek/blob/main/CHANGELOG.md"

[project.scripts]
jsonpeek = "jsonpeek.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
